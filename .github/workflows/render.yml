name: render

# Renders the chunks of one video in parallel, one machine per chunk.
# Input (from tools/cloud-render.mjs in the private project):
#   {"id":"C-4","pack":"C-4-pack.tgz","chunks":["1-3","4-6", ...]}
# The pack is a release asset (release "packs"): every asset once + each chunk's HTML (see unpack.mjs).
# Output: one artifact per chunk ("chunk-<r>") holding <id>-v3-<r>.mp4, kept for 3 days.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "JSON: {id, pack, chunks:[r]}"
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      chunks: ${{ steps.m.outputs.chunks }}
      id: ${{ steps.m.outputs.id }}
      pack: ${{ steps.m.outputs.pack }}
    steps:
      - id: m
        env:
          JOB: ${{ inputs.job }}
        run: |
          echo "chunks=$(jq -c '.chunks' <<<"$JOB")" >> "$GITHUB_OUTPUT"
          echo "pack=$(jq -r '.pack' <<<"$JOB" | tr -cd 'A-Za-z0-9._-')" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r '.id' <<<"$JOB" | tr -cd 'A-Za-z0-9-')" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    env:
      ID: ${{ needs.plan.outputs.id }}
      R: ${{ matrix.chunk }}
      PACK: ${{ needs.plan.outputs.pack }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-noto-core > /dev/null
          fc-cache -f > /dev/null
          npm ci --no-audit --no-fund
      - name: Fetch pack, rebuild chunk
        run: |
          case "$R" in *[!0-9-]*) echo "bad chunk name"; exit 1;; esac
          gh release download packs -R "$GITHUB_REPOSITORY" -p "$PACK" -O pack.tgz
          mkdir pack && tar -xzf pack.tgz -C pack
          node unpack.mjs pack "$R" chunk
      - name: Render
        run: |
          cd chunk
          npx hyperframes render --quality standard --workers auto --protocol-timeout 1200000 -o "$GITHUB_WORKSPACE/$ID-v3-$R.mp4"
      # the light 720p copy is made here, per chunk and all at once (same settings as before), so finish only joins it
      - name: Light 720p copy
        run: |
          ffmpeg -v error -y -i "$ID-v3-$R.mp4" -an -vf scale=-2:720:flags=lanczos -c:v libx264 -preset slow -tune animation -crf 20 -maxrate 2600k -bufsize 5200k -g 60 -pix_fmt yuv420p "$ID-v3-$R-720.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: |
            ${{ env.ID }}-v3-${{ matrix.chunk }}.mp4
            ${{ env.ID }}-v3-${{ matrix.chunk }}-720.mp4
          retention-days: 3
          compression-level: 0
